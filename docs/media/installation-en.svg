illable="true" x="129" y="741" width="915" height="158" rx="18" fill="#1b2b39" fill-opacity="1" stroke="none" stroke-width="2" transform="rotate(0 586.5 820)"/><ellipse class="item" data-id="guide-158" data-paint-layer="fill" data-outline-only="false" data-locked="false" data-fillable="true" cx="78" cy="962" rx="25" ry="25" fill="#79c7ff" fill-opacity="1" stroke="none" stroke-width="0" transform="rotate(0 78 962)"/><rect class="item" data-id="guide-160" data-paint-layer="fill" data-outline-only="false" data-locked="false" data-fillable="true" x="129" y="917" width="915" height="158" rx="18" fill="#1b2b39" fill-opacity="1" stroke="none" stroke-width="2" transform="rotate(0 586.5 996)"/><ellipse class="item" data-id="guide-164" data-paint-layer="fill" data-outline-only="false" data-locked="false" data-fillable="true" cx="78" cy="1138" rx="25" ry="25" fill="#ffc580" fill-opacity="1" stroke="none" stroke-width="0" transform="rotate(0 78 1138)"/><rect class="item" data-id="guide-166" data-paint-layer="fill" data-outline-only="false" data-locked="false" data-fillable="true" x="129" y="1093" width="915" height="158" rx="18" fill="#1b2b39" fill-opacity="1" stroke="none" stroke-width="2" transform="rotate(0 586.5 1172)"/><text class="item" data-id="guide-126" x="54" y="54" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" text-anchor="start" fill="#77dfc8" transform="rotate(0 549 50)"><tspan x="54" y="54">FIRST-TIME SETUP  /  WINDOWS</tspan></text><text class="item" data-id="guide-127" x="54" y="117.79999999999998" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="39" font-weight="700" font-style="normal" text-anchor="start" fill="#f4f6fa" transform="rotate(0 549 110)"><tspan x="54" y="117.79999999999998">Install remotely first, then locally</tspan></text><text class="item" data-id="guide-128" x="54" y="167.2" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" font-style="normal" text-anchor="start" fill="#b9c6d4" transform="rotate(0 549 163)"><tspan x="54" y="167.2">Steps 1–3 use the SAME extracted folder on the REMOTE computer.</tspan></text><g data-id="guide-129" data-paint-layer="foreground" data-outline-only="true" data-locked="false" data-fillable="false" data-perfect-arc="false" data-attach-start="" data-attach-end=""><defs><marker id="main-head-guide-129" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#385267"/></marker></defs><path class="arrow-line" d="M78 273 C78 273 78 403 78 403" stroke="#385267" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="fill:none;fill-opacity:0"/></g><text class="item" data-id="guide-131" x="78" y="263" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" font-style="normal" text-anchor="middle" fill="#101b25" transform="rotate(0 78 258)"><tspan x="78" y="263">1</tspan></text><text class="item" data-id="guide-133" x="154" y="239.4" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" text-anchor="start" fill="#ffc580" transform="rotate(0 580 236)"><tspan x="154" y="239.4">REMOTE</tspan></text><text class="item" data-id="guide-134" x="154" y="281.5" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" font-style="normal" text-anchor="start" fill="#f4f6fa" transform="rotate(0 585 276.5)"><tspan x="154" y="281.5">Download source → Extract All</tspan></text><text class="item" data-id="guide-135" x="154" y="320.7" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" font-style="normal" text-anchor="start" fill="#b9c6d4" transform="rotate(0 585 329.5)"><tspan x="154" y="320.7">GitHub → Code → Download ZIP</tspan><tspan x="154" y="346.3">Do not run the scripts from inside the ZIP.</tspan></text><g data-id="guide-136" data-paint-layer="foreground" data-outline-only="true" data-locked="false" data-fillable="false" data-perfect-arc="false" data-attach-start="" data-attach-end=""><defs><marker id="main-head-guide-136" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#385267"/></marker></defs><path class="arrow-line" d="M78 449 C78 449 78 579 78 579" stroke="#385267" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="fill:none;fill-opacity:0"/></g><text class="item" data-id="guide-138" x="78" y="439" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" font-style="normal" text-anchor="middle" fill="#101b25" transform="rotate(0 78 434)"><tspan x="78" y="439">2</tspan></text><text class="item" data-id="guide-140" x="154" y="415.4" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" text-anchor="start" fill="#ffc580" transform="rotate(0 580 412)"><tspan x="154" y="415.4">REMOTE</tspan></text><text class="item" data-id="guide-141" x="154" y="457.5" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" font-style="normal" text-anchor="start" fill="#f4f6fa" transform="rotate(0 585 452.5)"><tspan x="154" y="457.5">Run 1-Install-Receiver.cmd</tspan></text><text class="item" data-id="guide-142" x="154" y="509.5" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" font-style="normal" text-anchor="start" fill="#b9c6d4" transform="rotate(0 585 505.5)"><tspan x="154" y="509.5">Wait until the receiver window says the connection is verified.</tspan></text><g data-id="guide-143" data-paint-layer="foreground" data-outline-only="true" data-locked="false" data-fillable="false" data-perfect-arc="false" data-attach-start="" data-attach-end=""><defs><marker id="main-head-guide-143" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#385267"/></marker></defs><path class="arrow-line" d="M78 625 C78 625 78 755 78 755" stroke="#385267" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="fill:none;fill-opacity:0"/></g><text class="item" data-id="guide-145" x="78" y="615" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" font-style="normal" text-anchor="middle" fill="#101b25" transform="rotate(0 78 610)"><tspan x="78" y="615">3</tspan></text><text class="item" data-id="guide-147" x="154" y="591.4" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" text-anchor="start" fill="#ffc580" transform="rotate(0 580 588)"><tspan x="154" y="591.4">STILL REMOTE</tspan></text><text class="item" data-id="guide-148" x="154" y="633.5" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" font-style="normal" text-anchor="start" fill="#f4f6fa" transform="rotate(0 585 628.5)"><tspan x="154" y="633.5">Run 2-Create-Sender.cmd</tspan></text><text class="item" data-id="guide-149" x="154" y="685.5" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" font-style="normal" text-anchor="start" fill="#b9c6d4" transform="rotate(0 585 681.5)"><tspan x="154" y="685.5">Keep using the SAME folder. Do not start from a new download.</tspan></text><g data-id="guide-150" data-paint-layer="foreground" data-outline-only="true" data-locked="false" data-fillable="false" data-perfect-arc="false" data-attach-start="" data-attach-end=""><defs><marker id="main-head-guide-150" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#385267"/></marker></defs><path class="arrow-line" d="M78 801 C78 801 78 931 78 931" stroke="#385267" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="fill:none;fill-opacity:0"/></g><text class="item" data-id="guide-152" x="78" y="791" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" font-style="normal" text-anchor="middle" fill="#101b25" transform="rotate(0 78 786)"><tspan x="78" y="791">4</tspan></text><text class="item" data-id="guide-154" x="154" y="767.4" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" text-anchor="start" fill="#ffc580" transform="rotate(0 580 764)"><tspan x="154" y="767.4">REMOTE → LOCAL</tspan></text><text class="item" data-id="guide-155" x="154" y="809.5" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" font-style="normal" text-anchor="start" fill="#f4f6fa" transform="rotate(0 585 804.5)"><tspan x="154" y="809.5">Download the Sender EXE locally</tspan></text><text class="item" data-id="guide-156" x="154" y="848.6999999999999" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" font-style="normal" text-anchor="start" fill="#b9c6d4" transform="rotate(0 585 857.5)"><tspan x="154" y="848.6999999999999">Remote Desktop sidebar → Download file</tspan><tspan x="154" y="874.3">Choose dist / RemoteImageBridge-Sender.exe</tspan></text><g data-id="guide-157" data-paint-layer="foreground" data-outline-only="true" data-locked="false" data-fillable="false" data-perfect-arc="false" data-attach-start="" data-attach-end=""><defs><marker id="main-head-guide-157" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#385267"/></marker></defs><path class="arrow-line" d="M78 977 C78 977 78 1107 78 1107" stroke="#385267" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="fill:none;fill-opacity:0"/></g><text class="item" data-id="guide-159" x="78" y="967" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" font-style="normal" text-anchor="middle" fill="#101b25" transform="rotate(0 78 962)"><tspan x="78" y="967">5</tspan></text><text class="item" data-id="guide-161" x="154" y="943.4" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" text-anchor="start" fill="#79c7ff" transform="rotate(0 580 940)"><tspan x="154" y="943.4">LOCAL</tspan></text><text class="item" data-id="guide-162" x="154" y="985.5" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" font-style="normal" text-anchor="start" fill="#f4f6fa" transform="rotate(0 585 980.5)"><tspan x="154" y="985.5">Run RemoteImageBridge-Sender.exe</tspan></text><text class="item" data-id="guide-163" x="154" y="1037.5" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" font-style="normal" text-anchor="start" fill="#b9c6d4" transform="rotate(0 585 1033.5)"><tspan x="154" y="1037.5">Wait for connection verified, then take a NEW screenshot.</tspan></text><text class="item" data-id="guide-165" x="78" y="1143" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" font-style="normal" text-anchor="middle" fill="#101b25" transform="rotate(0 78 1138)"><tspan x="78" y="1143">6</tspan></text><text class="item" data-id="guide-167" x="154" y="1119.3999999999999" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" text-anchor="start" fill="#ffc580" transform="rotate(0 580 1116)"><tspan x="154" y="1119.3999999999999">REMOTE</tspan></text><text class="item" data-id="guide-168" x="154" y="1161.5" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" font-style="normal" text-anchor="start" fill="#f4f6fa" transform="rotate(0 585 1156.5)"><tspan x="154" y="1161.5">Wait for 100%, then Ctrl + V</tspan></text><text class="item" data-id="guide-169" x="154" y="1213.5" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" font-style="normal" text-anchor="start" fill="#b9c6d4" transform="rotate(0 585 1209.5)"><tspan x="154" y="1213.5">Click the destination app input area and paste the image.</tspan></text><text class="item" data-id="guide-170" x="54" y="1311.64" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" font-style="normal" text-anchor="start" fill="#b9c6d4" transform="rotate(0 549 1320)"><tspan x="54" y="1311.64">Receiver restarted? Use Re-pair to refresh its address.</tspan><tspan x="54" y="1335.96">Share the GitHub source with friends, not your private paired EXEs.</tspan></text></g>
