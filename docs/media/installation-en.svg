          <g id="scene"><ellipse class="item" data-id="guide-109" data-paint-layer="fill" data-outline-only="false" data-locked="false" data-fillable="true" cx="78" cy="258" rx="25" ry="25" fill="#ffc580" fill-opacity="1" stroke="none" stroke-width="0" transform="rotate(0 78 258)"/><rect class="item" data-id="guide-111" data-paint-layer="fill" data-outline-only="false" data-locked="false" data-fillable="true" x="129" y="213" width="915" height="158" rx="18" fill="#1b2b39" fill-opacity="1" stroke="none" stroke-width="2" transform="rotate(0 586.5 292)"/><ellipse class="item" data-id="guide-116" data-paint-layer="fill" data-outline-only="false" data-locked="false" data-fillable="true" cx="78" cy="434" rx="25" ry="25" fill="#79c7ff" fill-opacity="1" stroke="none" stroke-width="0" transform="rotate(0 78 434)"/><rect class="item" data-id="guide-118" data-paint-layer="fill" data-outline-only="false" data-locked="false" data-fillable="true" x="129" y="389" width="915" height="158" rx="18" fill="#1b2b39" fill-opacity="1" stroke="none" stroke-width="2" transform="rotate(0 586.5 468)"/><ellipse class="item" data-id="guide-122" data-paint-layer="fill" data-outline-only="false" data-locked="false" data-fillable="true" cx="78" cy="610" rx="25" ry="25" fill="#ffc580" fill-opacity="1" stroke="none" stroke-width="0" transform="rotate(0 78 610)"/><rect class="item" data-id="guide-124" data-paint-layer="fill" data-outline-only="false" data-locked="false" data-fillable="true" x="129" y="565" width="915" height="158" rx="18" fill="#1b2b39" fill-opacity="1" stroke="none" stroke-width="2" transform="rotate(0 586.5 644)"/><text class="item" data-id="guide-105" x="54" y="54" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" text-anchor="start" fill="#77dfc8" transform="rotate(0 549 50)"><tspan x="54" y="54">FIRST-TIME SETUP  /  WINDOWS</tspan></text><text class="item" data-id="guide-106" x="54" y="117.79999999999998" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="39" font-weight="700" font-style="normal" text-anchor="start" fill="#f4f6fa" transform="rotate(0 549 110)"><tspan x="54" y="117.79999999999998">Two installs. One pairing code.</tspan></text><text class="item" data-id="guide-107" x="54" y="167.2" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" font-style="normal" text-anchor="start" fill="#b9c6d4" transform="rotate(0 549 163)"><tspan x="54" y="167.2">Download the SAME installer on both PCs. No build or extension.</tspan></text><g data-id="guide-108" data-paint-layer="foreground" data-outline-only="true" data-locked="false" data-fillable="false" data-perfect-arc="false" data-attach-start="" data-attach-end=""><defs><marker id="main-head-guide-108" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#385267"/></marker></defs><path class="arrow-line" d="M78 273 C78 273 78 403 78 403" stroke="#385267" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="fill:none;fill-opacity:0"/></g><text class="item" data-id="guide-110" x="78" y="263" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" font-style="normal" text-anchor="middle" fill="#101b25" transform="rotate(0 78 258)"><tspan x="78" y="263">1</tspan></text><text class="item" data-id="guide-112" x="154" y="239.4" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" text-anchor="start" fill="#ffc580" transform="rotate(0 580 236)"><tspan x="154" y="239.4">REMOTE · THE CONTROLLED PC</tspan></text><text class="item" data-id="guide-113" x="154" y="281.5" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" font-style="normal" text-anchor="start" fill="#f4f6fa" transform="rotate(0 585 276.5)"><tspan x="154" y="281.5">Install and choose Receiver</tspan></text><text class="item" data-id="guide-114" x="154" y="333.5" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" font-style="normal" text-anchor="start" fill="#b9c6d4" transform="rotate(0 585 329.5)"><tspan x="154" y="333.5">Wait for connection verified → Pair computer → Copy pairing code.</tspan></text><g data-id="guide-115" data-paint-layer="foreground" data-outline-only="true" data-locked="false" data-fillable="false" data-perfect-arc="false" data-attach-start="" data-attach-end=""><defs><marker id="main-head-guide-115" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#385267"/></marker></defs><path class="arrow-line" d="M78 449 C78 449 78 579 78 579" stroke="#385267" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="fill:none;fill-opacity:0"/></g><text class="item" data-id="guide-117" x="78" y="439" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" font-style="normal" text-anchor="middle" fill="#101b25" transform="rotate(0 78 434)"><tspan x="78" y="439">2</tspan></text><text class="item" data-id="guide-119" x="154" y="415.4" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" text-anchor="start" fill="#79c7ff" transform="rotate(0 580 412)"><tspan x="154" y="415.4">LOCAL · THE PC IN FRONT OF YOU</tspan></text><text class="item" data-id="guide-120" x="154" y="457.5" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" font-style="normal" text-anchor="start" fill="#f4f6fa" transform="rotate(0 585 452.5)"><tspan x="154" y="457.5">Install and choose Sender</tspan></text><text class="item" data-id="guide-121" x="154" y="509.5" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" font-style="normal" text-anchor="start" fill="#b9c6d4" transform="rotate(0 585 505.5)"><tspan x="154" y="509.5">Paste the complete pairing code → Install and start.</tspan></text><text class="item" data-id="guide-123" x="78" y="615" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" font-style="normal" text-anchor="middle" fill="#101b25" transform="rotate(0 78 610)"><tspan x="78" y="615">3</tspan></text><text class="item" data-id="guide-125" x="154" y="591.4" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" text-anchor="start" fill="#ffc580" transform="rotate(0 580 588)"><tspan x="154" y="591.4">READY TO USE</tspan></text><text class="item" data-id="guide-126" x="154" y="633.5" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" font-style="normal" text-anchor="start" fill="#f4f6fa" transform="rotate(0 585 628.5)"><tspan x="154" y="633.5">Screenshot locally. Ctrl + V remotely.</tspan></text><text class="item" data-id="guide-127" x="154" y="685.5" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" font-style="normal" text-anchor="start" fill="#b9c6d4" transform="rotate(0 585 681.5)"><tspan x="154" y="685.5">Win + Shift + S locally → wait for 100% → paste remotely.</tspan></text><text class="item" data-id="guide-128" x="54" y="776.64" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" font-style="normal" text-anchor="start" fill="#b9c6d4" transform="rotate(0 549 785)"><tspan x="54" y="776.64">Receiver restarted? Copy its new pairing code to the sender.</tspan><tspan x="54" y="800.96">Share the installer freely. Keep your pairing code private.</tspan></text></g>
        <g id="cut-preview" pointer-events="none"/></svg>
