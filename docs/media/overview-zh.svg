700" font-style="normal" text-anchor="middle" fill="#ffc580" transform="rotate(0 1055 278)"><tspan x="1055" y="281.79999999999995">遠端 · 接收端</tspan></text><rect class="item" data-id="guide-10" data-paint-layer="line" data-outline-only="true" data-locked="false" data-fillable="true" x="105" y="329" width="180" height="112" rx="12" fill="#101b25" fill-opacity="0" stroke="#79c7ff" stroke-width="3" transform="rotate(0 195 385)"/><rect class="item" data-id="guide-14" data-paint-layer="foreground" data-outline-only="true" data-locked="false" data-fillable="true" x="161" y="355" width="66" height="49" rx="4" fill="none" fill-opacity="1" stroke="#79c7ff" stroke-width="2" transform="rotate(0 194 379.5)"/><g data-id="guide-16" data-paint-layer="foreground" data-outline-only="true" data-locked="false" data-fillable="false" data-perfect-arc="false" data-attach-start="" data-attach-end=""><defs><marker id="main-head-guide-16" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#79c7ff"/></marker></defs><path class="arrow-line" d="M173 391 C173 391 187 376 187 376" stroke="#79c7ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="fill:none;fill-opacity:0"/></g><g data-id="guide-17" data-paint-layer="foreground" data-outline-only="true" data-locked="false" data-fillable="false" data-perfect-arc="false" data-attach-start="" data-attach-end=""><defs><marker id="main-head-guide-17" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#79c7ff"/></marker></defs><path class="arrow-line" d="M187 376 C187 376 215 395 215 395" stroke="#79c7ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="fill:none;fill-opacity:0"/></g><rect class="item" data-id="guide-18" data-paint-layer="line" data-outline-only="true" data-locked="false" data-fillable="true" x="955" y="329" width="180" height="112" rx="12" fill="#101b25" fill-opacity="0" stroke="#ffc580" stroke-width="3" transform="rotate(0 1045 385)"/><rect class="item" data-id="guide-22" data-paint-layer="foreground" data-outline-only="true" data-locked="false" data-fillable="true" x="1011" y="355" width="66" height="49" rx="4" fill="none" fill-opacity="1" stroke="#ffc580" stroke-width="2" transform="rotate(0 1044 379.5)"/><g data-id="guide-24" data-paint-layer="foreground" data-outline-only="true" data-locked="false" data-fillable="false" data-perfect-arc="false" data-attach-start="" data-attach-end=""><defs><marker id="main-head-guide-24" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ffc580"/></marker></defs><path class="arrow-line" d="M1023 391 C1023 391 1037 376 1037 376" stroke="#ffc580" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="fill:none;fill-opacity:0"/></g><g data-id="guide-25" data-paint-layer="foreground" data-outline-only="true" data-locked="false" data-fillable="false" data-perfect-arc="false" data-attach-start="" data-attach-end=""><defs><marker id="main-head-guide-25" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ffc580"/></marker></defs><path class="arrow-line" d="M1037 376 C1037 376 1065 395 1065 395" stroke="#ffc580" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="fill:none;fill-opacity:0"/></g><text class="item" data-id="guide-26" x="317" y="360.40000000000003" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" font-style="normal" text-anchor="start" fill="#f4f6fa" transform="rotate(0 467 355)"><tspan x="317" y="360.40000000000003">你手邊的電腦</tspan></text><text class="item" data-id="guide-27" x="317" y="411.82" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" font-style="normal" text-anchor="start" fill="#b9c6d4" transform="rotate(0 462 421.5)"><tspan x="317" y="411.82">家裡電腦或筆電</tspan><tspan x="317" y="439.98">在這裡截圖</tspan></text><text class="item" data-id="guide-28" x="1167" y="360.2" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" font-style="normal" text-anchor="start" fill="#f4f6fa" transform="rotate(0 1318 355)"><tspan x="1167" y="360.2">被你控制的電腦</tspan></text><text class="item" data-id="guide-29" x="1167" y="412.82" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" font-style="normal" text-anchor="start" fill="#b9c6d4" transform="rotate(0 1307 422.5)"><tspan x="1167" y="412.82">辦公室或實驗室</tspan><tspan x="1167" y="440.98">在這裡貼上</tspan></text><text class="item" data-id="guide-31" x="355" y="549.6999999999999" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" font-style="normal" text-anchor="middle" fill="#79c7ff" transform="rotate(0 355 543.5)"><tspan x="355" y="549.6999999999999">Win + Shift + S</tspan></text><text class="item" data-id="guide-33" x="1205" y="549.6999999999999" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" font-style="normal" text-anchor="middle" fill="#ffc580" transform="rotate(0 1205 543.5)"><tspan x="1205" y="549.6999999999999">Ctrl + V</tspan></text><text class="item" data-id="guide-34" x="355" y="613.1" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" font-style="normal" text-anchor="middle" fill="#b9c6d4" transform="rotate(0 355 608.5)"><tspan x="355" y="613.1">截完圖，自動傳送，不用另存檔</tspan></text><text class="item" data-id="guide-35" x="1205" y="614.1999999999999" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" font-style="normal" text-anchor="middle" fill="#b9c6d4" transform="rotate(0 1205 610)"><tspan x="1205" y="614.1999999999999">等進度 100%，再貼到目標程式</tspan></text><g data-id="guide-36" data-paint-layer="foreground" data-outline-only="true" data-locked="false" data-fillable="false" data-perfect-arc="false" data-attach-start="" data-attach-end=""><defs><marker id="main-head-guide-36" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="17" markerHeight="17" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#77dfc8"/></marker></defs><path class="arrow-line" d="M676 421 C676 421 883 421 883 421" stroke="#77dfc8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" style="fill:none;fill-opacity:0" marker-end="url(#main-head-guide-36)"/></g><text class="item" data-id="guide-37" x="779.5" y="368.40000000000003" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" font-style="normal" text-anchor="middle" fill="#77dfc8" transform="rotate(0 779.5 364)"><tspan x="779.5" y="368.40000000000003">圖片自動送達</tspan></text><text class="item" data-id="guide-38" x="779.5" y="468.58" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" font-style="normal" text-anchor="middle" fill="#b9c6d4" transform="rotate(0 779.5 476.5)"><tspan x="779.5" y="468.58">加密傳輸</tspan><tspan x="779.5" y="491.62">不用反覆點遠端視窗</tspan></text><text class="item" data-id="guide-40" x="88" y="735.38" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" font-style="normal" text-anchor="start" fill="#f4f6fa" transform="rotate(0 781 745.5)"><tspan x="88" y="735.38">第一次請先安裝「遠端接收端」，再建立「本機傳送端」。</tspan><tspan x="88" y="764.82">每次使用：兩端連線已確認 → 本機重新截圖 → 遠端 Ctrl+V。</tspan></text></g>
