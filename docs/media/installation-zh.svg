<svg xmlns="http://www.w3.org/2000/svg" class="stage" id="stage" viewBox="0 0 1100 845" aria-label="installation-zh分層編輯畫布">
          <defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
          <rect id="stage-background" x="0" y="0" width="1100" height="845" rx="10" ry="10" fill="#fff" style="fill: rgb(16, 27, 37); fill-opacity: 1;"/>
          <g id="scene"><ellipse class="item" data-id="guide-85" data-paint-layer="fill" data-outline-only="false" data-locked="false" data-fillable="true" cx="78" cy="258" rx="25" ry="25" fill="#ffc580" fill-opacity="1" stroke="none" stroke-width="0" transform="rotate(0 78 258)"/><rect class="item" data-id="guide-87" data-paint-layer="fill" data-outline-only="false" data-locked="false" data-fillable="true" x="129" y="213" width="915" height="158" rx="18" fill="#1b2b39" fill-opacity="1" stroke="none" stroke-width="2" transform="rotate(0 586.5 292)"/><ellipse class="item" data-id="guide-92" data-paint-layer="fill" data-outline-only="false" data-locked="false" data-fillable="true" cx="78" cy="434" rx="25" ry="25" fill="#79c7ff" fill-opacity="1" stroke="none" stroke-width="0" transform="rotate(0 78 434)"/><rect class="item" data-id="guide-94" data-paint-layer="fill" data-outline-only="false" data-locked="false" data-fillable="true" x="129" y="389" width="915" height="158" rx="18" fill="#1b2b39" fill-opacity="1" stroke="none" stroke-width="2" transform="rotate(0 586.5 468)"/><ellipse class="item" data-id="guide-98" data-paint-layer="fill" data-outline-only="false" data-locked="false" data-fillable="true" cx="78" cy="610" rx="25" ry="25" fill="#ffc580" fill-opacity="1" stroke="none" stroke-width="0" transform="rotate(0 78 610)"/><rect class="item" data-id="guide-100" data-paint-layer="fill" data-outline-only="false" data-locked="false" data-fillable="true" x="129" y="565" width="915" height="158" rx="18" fill="#1b2b39" fill-opacity="1" stroke="none" stroke-width="2" transform="rotate(0 586.5 644)"/><text class="item" data-id="guide-81" x="54" y="54" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" text-anchor="start" fill="#77dfc8" transform="rotate(0 549 50)"><tspan x="54" y="54">FIRST-TIME SETUP  /  WINDOWS</tspan></text><text class="item" data-id="guide-82" x="54" y="117.79999999999998" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="39" font-weight="700" font-style="normal" text-anchor="start" fill="#f4f6fa" transform="rotate(0 549 110)"><tspan x="54" y="117.79999999999998">兩台安裝，貼上配對碼就能用</tspan></text><text class="item" data-id="guide-83" x="54" y="167.2" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" font-style="normal" text-anchor="start" fill="#b9c6d4" transform="rotate(0 549 163)"><tspan x="54" y="167.2">兩台都下載同一個安裝檔，不用編譯或安裝 Chrome 外掛。</tspan></text><g data-id="guide-84" data-paint-layer="foreground" data-outline-only="true" data-locked="false" data-fillable="false" data-perfect-arc="false" data-attach-start="" data-attach-end=""><defs><marker id="main-head-guide-84" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#385267"/></marker></defs><path class="arrow-line" d="M78 273 C78 273 78 403 78 403" stroke="#385267" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="fill:none;fill-opacity:0"/></g><text class="item" data-id="guide-86" x="78" y="263" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" font-style="normal" text-anchor="middle" fill="#101b25" transform="rotate(0 78 258)"><tspan x="78" y="263">1</tspan></text><text class="item" data-id="guide-88" x="154" y="239.4" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" text-anchor="start" fill="#ffc580" transform="rotate(0 580 236)"><tspan x="154" y="239.4">遠端 · 被你控制的電腦</tspan></text><text class="item" data-id="guide-89" x="154" y="281.5" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" font-style="normal" text-anchor="start" fill="#f4f6fa" transform="rotate(0 585 276.5)"><tspan x="154" y="281.5">安裝後選「接收圖片」</tspan></text><text class="item" data-id="guide-90" x="154" y="333.5" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" font-style="normal" text-anchor="start" fill="#b9c6d4" transform="rotate(0 585 329.5)"><tspan x="154" y="333.5">等連線已確認 → 按「配對電腦」→ 複製配對碼。</tspan></text><g data-id="guide-91" data-paint-layer="foreground" data-outline-only="true" data-locked="false" data-fillable="false" data-perfect-arc="false" data-attach-start="" data-attach-end=""><defs><marker id="main-head-guide-91" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#385267"/></marker></defs><path class="arrow-line" d="M78 449 C78 449 78 579 78 579" stroke="#385267" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="fill:none;fill-opacity:0"/></g><text class="item" data-id="guide-93" x="78" y="439" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" font-style="normal" text-anchor="middle" fill="#101b25" transform="rotate(0 78 434)"><tspan x="78" y="439">2</tspan></text><text class="item" data-id="guide-95" x="154" y="415.4" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" text-anchor="start" fill="#79c7ff" transform="rotate(0 580 412)"><tspan x="154" y="415.4">本機 · 手邊的電腦</tspan></text><text class="item" data-id="guide-96" x="154" y="457.5" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" font-style="normal" text-anchor="start" fill="#f4f6fa" transform="rotate(0 585 452.5)"><tspan x="154" y="457.5">安裝後選「傳送圖片」</tspan></text><text class="item" data-id="guide-97" x="154" y="509.5" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" font-style="normal" text-anchor="start" fill="#b9c6d4" transform="rotate(0 585 505.5)"><tspan x="154" y="509.5">貼上完整配對碼 → 安裝並啟動 → 等連線已確認。</tspan></text><text class="item" data-id="guide-99" x="78" y="615" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" font-style="normal" text-anchor="middle" fill="#101b25" transform="rotate(0 78 610)"><tspan x="78" y="615">3</tspan></text><text class="item" data-id="guide-101" x="154" y="591.4" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" text-anchor="start" fill="#ffc580" transform="rotate(0 580 588)"><tspan x="154" y="591.4">開始使用</tspan></text><text class="item" data-id="guide-102" x="154" y="633.5" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" font-style="normal" text-anchor="start" fill="#f4f6fa" transform="rotate(0 585 628.5)"><tspan x="154" y="633.5">本機截圖，遠端 Ctrl + V</tspan></text><text class="item" data-id="guide-103" x="154" y="685.5" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" font-style="normal" text-anchor="start" fill="#b9c6d4" transform="rotate(0 585 681.5)"><tspan x="154" y="685.5">本機按 Win + Shift + S → 等 100% → 遠端貼上。</tspan></text><text class="item" data-id="guide-104" x="54" y="776.64" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" font-style="normal" text-anchor="start" fill="#b9c6d4" transform="rotate(0 549 785)"><tspan x="54" y="776.64">遠端工具重啟後，再複製一次新的配對碼。</tspan><tspan x="54" y="800.96">安裝檔可以分享，配對碼只交給自己的電腦。</tspan></text></g>
        <g id="cut-preview" pointer-events="none"/></svg>
