" font-style="normal" text-anchor="start" fill="#b9c6d4" transform="rotate(0 549 163)"><tspan x="54" y="167.2">步驟 1–3 都在同一台遠端電腦、同一個解壓縮資料夾完成。</tspan></text><g data-id="guide-84" data-paint-layer="foreground" data-outline-only="true" data-locked="false" data-fillable="false" data-perfect-arc="false" data-attach-start="" data-attach-end=""><defs><marker id="main-head-guide-84" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#385267"/></marker></defs><path class="arrow-line" d="M78 273 C78 273 78 403 78 403" stroke="#385267" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="fill:none;fill-opacity:0"/></g><text class="item" data-id="guide-86" x="78" y="263" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" font-style="normal" text-anchor="middle" fill="#101b25" transform="rotate(0 78 258)"><tspan x="78" y="263">1</tspan></text><text class="item" data-id="guide-88" x="154" y="239.4" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" text-anchor="start" fill="#ffc580" transform="rotate(0 580 236)"><tspan x="154" y="239.4">遠端</tspan></text><text class="item" data-id="guide-89" x="154" y="281.5" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" font-style="normal" text-anchor="start" fill="#f4f6fa" transform="rotate(0 585 276.5)"><tspan x="154" y="281.5">下載原始碼並「全部解壓縮」</tspan></text><text class="item" data-id="guide-90" x="154" y="320.7" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" font-style="normal" text-anchor="start" fill="#b9c6d4" transform="rotate(0 585 329.5)"><tspan x="154" y="320.7">GitHub → Code → Download ZIP</tspan><tspan x="154" y="346.3">不要在 ZIP 裡直接執行檔案。</tspan></text><g data-id="guide-91" data-paint-layer="foreground" data-outline-only="true" data-locked="false" data-fillable="false" data-perfect-arc="false" data-attach-start="" data-attach-end=""><defs><marker id="main-head-guide-91" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#385267"/></marker></defs><path class="arrow-line" d="M78 449 C78 449 78 579 78 579" stroke="#385267" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="fill:none;fill-opacity:0"/></g><text class="item" data-id="guide-93" x="78" y="439" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" font-style="normal" text-anchor="middle" fill="#101b25" transform="rotate(0 78 434)"><tspan x="78" y="439">2</tspan></text><text class="item" data-id="guide-95" x="154" y="415.4" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" text-anchor="start" fill="#ffc580" transform="rotate(0 580 412)"><tspan x="154" y="415.4">遠端</tspan></text><text class="item" data-id="guide-96" x="154" y="457.5" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" font-style="normal" text-anchor="start" fill="#f4f6fa" transform="rotate(0 585 452.5)"><tspan x="154" y="457.5">雙擊 1-Install-Receiver.cmd</tspan></text><text class="item" data-id="guide-97" x="154" y="509.5" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" font-style="normal" text-anchor="start" fill="#b9c6d4" transform="rotate(0 585 505.5)"><tspan x="154" y="509.5">安裝並開啟接收端；等待視窗顯示「連線已確認」。</tspan></text><g data-id="guide-98" data-paint-layer="foreground" data-outline-only="true" data-locked="false" data-fillable="false" data-perfect-arc="false" data-attach-start="" data-attach-end=""><defs><marker id="main-head-guide-98" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#385267"/></marker></defs><path class="arrow-line" d="M78 625 C78 625 78 755 78 755" stroke="#385267" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="fill:none;fill-opacity:0"/></g><text class="item" data-id="guide-100" x="78" y="615" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" font-style="normal" text-anchor="middle" fill="#101b25" transform="rotate(0 78 610)"><tspan x="78" y="615">3</tspan></text><text class="item" data-id="guide-102" x="154" y="591.4" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" text-anchor="start" fill="#ffc580" transform="rotate(0 580 588)"><tspan x="154" y="591.4">仍在遠端</tspan></text><text class="item" data-id="guide-103" x="154" y="633.5" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" font-style="normal" text-anchor="start" fill="#f4f6fa" transform="rotate(0 585 628.5)"><tspan x="154" y="633.5">雙擊 2-Create-Sender.cmd</tspan></text><text class="item" data-id="guide-104" x="154" y="685.5" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" font-style="normal" text-anchor="start" fill="#b9c6d4" transform="rotate(0 585 681.5)"><tspan x="154" y="685.5">在同一個資料夾建立傳送端；不要另下載一份專案。</tspan></text><g data-id="guide-105" data-paint-layer="foreground" data-outline-only="true" data-locked="false" data-fillable="false" data-perfect-arc="false" data-attach-start="" data-attach-end=""><defs><marker id="main-head-guide-105" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#385267"/></marker></defs><path class="arrow-line" d="M78 801 C78 801 78 931 78 931" stroke="#385267" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="fill:none;fill-opacity:0"/></g><text class="item" data-id="guide-107" x="78" y="791" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" font-style="normal" text-anchor="middle" fill="#101b25" transform="rotate(0 78 786)"><tspan x="78" y="791">4</tspan></text><text class="item" data-id="guide-109" x="154" y="767.4" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" text-anchor="start" fill="#ffc580" transform="rotate(0 580 764)"><tspan x="154" y="767.4">遠端 → 本機</tspan></text><text class="item" data-id="guide-110" x="154" y="809.5" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" font-style="normal" text-anchor="start" fill="#f4f6fa" transform="rotate(0 585 804.5)"><tspan x="154" y="809.5">把 Sender.exe 下載到本機</tspan></text><text class="item" data-id="guide-111" x="154" y="848.6999999999999" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" font-style="normal" text-anchor="start" fill="#b9c6d4" transform="rotate(0 585 857.5)"><tspan x="154" y="848.6999999999999">Google Remote 側邊欄 → 下載檔案</tspan><tspan x="154" y="874.3">選 dist / RemoteImageBridge-Sender.exe</tspan></text><g data-id="guide-112" data-paint-layer="foreground" data-outline-only="true" data-locked="false" data-fillable="false" data-perfect-arc="false" data-attach-start="" data-attach-end=""><defs><marker id="main-head-guide-112" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#385267"/></marker></defs><path class="arrow-line" d="M78 977 C78 977 78 1107 78 1107" stroke="#385267" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="fill:none;fill-opacity:0"/></g><text class="item" data-id="guide-114" x="78" y="967" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" font-style="normal" text-anchor="middle" fill="#101b25" transform="rotate(0 78 962)"><tspan x="78" y="967">5</tspan></text><text class="item" data-id="guide-116" x="154" y="943.4" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" text-anchor="start" fill="#79c7ff" transform="rotate(0 580 940)"><tspan x="154" y="943.4">本機</tspan></text><text class="item" data-id="guide-117" x="154" y="985.5" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" font-style="normal" text-anchor="start" fill="#f4f6fa" transform="rotate(0 585 980.5)"><tspan x="154" y="985.5">雙擊 RemoteImageBridge-Sender.exe</tspan></text><text class="item" data-id="guide-118" x="154" y="1037.5" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" font-style="normal" text-anchor="start" fill="#b9c6d4" transform="rotate(0 585 1033.5)"><tspan x="154" y="1037.5">在家裡電腦執行；等待「連線已確認」，再重新截圖。</tspan></text><text class="item" data-id="guide-120" x="78" y="1143" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" font-style="normal" text-anchor="middle" fill="#101b25" transform="rotate(0 78 1138)"><tspan x="78" y="1143">6</tspan></text><text class="item" data-id="guide-122" x="154" y="1119.3999999999999" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" text-anchor="start" fill="#ffc580" transform="rotate(0 580 1116)"><tspan x="154" y="1119.3999999999999">遠端</tspan></text><text class="item" data-id="guide-123" x="154" y="1161.5" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" font-style="normal" text-anchor="start" fill="#f4f6fa" transform="rotate(0 585 1156.5)"><tspan x="154" y="1161.5">看到 100% 後，按 Ctrl + V</tspan></text><text class="item" data-id="guide-124" x="154" y="1213.5" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" font-style="normal" text-anchor="start" fill="#b9c6d4" transform="rotate(0 585 1209.5)"><tspan x="154" y="1213.5">先點要貼上的程式輸入區，再貼上圖片。</tspan></text><text class="item" data-id="guide-125" x="54" y="1311.64" style="font-family:Microsoft JhengHei, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" font-style="normal" text-anchor="start" fill="#b9c6d4" transform="rotate(0 549 1320)"><tspan x="54" y="1311.64">接收端重開後網址會變：按「重新配對」。</tspan><tspan x="54" y="1335.96">分享給朋友時，分享 GitHub 原始碼，不要分享自己的配對 EXE。</tspan></text></g>
